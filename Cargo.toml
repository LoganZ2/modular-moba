[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/client"]
# `cargo build` / `cargo run` / `cargo test` at the root only touch the native crates.
# The client is built for wasm32 via `scripts/build-client.sh`.
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
moba-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
